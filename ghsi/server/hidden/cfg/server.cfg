// ########## SERVER CONFIGURATION ##########

hostname "Hidden: Source - Gamer Server"
//Name for the server.
//Default: Hidden: Source - Gamer Server

sv_allowdownload 1
//Changes if joining players are able to download files from the server, such as custom maps.
//Default: 1

sv_allowupload 1
//Changes if joining players are able to upload files to the server, such as sprays.
//Default: 1

sv_alltalk 1
//Changes if the Hidden and the I.R.I.S can talk to each other in voice chat (1) or not (0).
//Default: 1

sv_downloadurl ""
//If you have a domain ready for map downloads and such, fill it in here.
//Default: N/A

sv_lan 0
//Changes if the server is hosted your local area network (1) or over the internet (0).
//Default: 0

sv_password ""
//An optional asked password for the server that is prompted to players upon joining.
//Default: N/A

//rcon_password "ChangeMe"
//Password for Remote Console access, which allows you to use the server console from in-game.
//Only here for hosts using a batch file to start the server. Remove the two slashes (//) before the command to use.
//Though, as the server host, you should just stick to using the server console itself anyway.
//Default: ChangeMe

sv_voiceenable 1
//Changes if voice chat is enabled (1) or disabled (0).
//Default: 1



// ########## GAMEPLAY SETTINGS: ROUND & MAP TIMERS ##########

mp_chattime 5
//How long in seconds the end-of-round intermission lasts for.
//Default: 5

mp_roundtime 300
//How long in seconds a round lasts for.
//Default: 300

mp_timelimit 30
//How long in minutes before a map gets automatically changed to the next one defined in mapcycle.txt.
//Default: 30

hdn_jointime 15
//How long in seconds until the first round starts after the map gets changed.
//Default: 15



// ########## GAMEPLAY SETTINGS: GENERAL ##########

hdn_deathnotices 0
//Changes if a killfeed is shown (1) or not shown (0).
//Default: 0

hdn_hiddenrounds 3
//How many rounds in a row a player can be the Hidden before being automatically changed.
//Default: 5

hdn_limitbombs 1
//Changes if the Hidden's pipebombs scale with the amount of I.R.I.S players (1) or if the Hidden starts with three (0).
//Default: 1

hdn_radio_limit 0
//How long in seconds someone can use a taunt/radio message again after doing one.
//Default: 0

hdn_selectmethod 0
//Changes how the Hidden is chosen per round - weighted (0), whoever kills the Hidden (1), or purely random (2).
//Default: 0

hdn_staminadrain -0.095
//Ratio of how fast the Hidden's stamina drains when clinging to a surface.
//Can be changed to zero to prevent stamina drain or a positive ratio to instead regenerate stamina.
//Default: -0.095

mp_friendlyfire 0
//Changes if friendly fire is enabled (1) or disabled (0).
//Default: 0

sv_footsteps 1
//Changes if player footsteps can be heard (1) or are muted (0).
//Default: 1

sv_pigstick 1
//Changes if the Pigsticker can be performed by the Hidden (1) or not (0).
//Default: 1



// ########## GAMEPLAY SETTINGS: OVERRUN MODE SPECIFIC ##########
//Note: These only take effect on Overrun, which can be played by loading a map with the "ovr_" prefix.

hdn_deathwait 5
//How long in seconds until a Hidden can respawn upon dying.
//Default: 5

hdn_survivaltime 15
//How long in seconds the last I.R.I.S standing has to live before being declared the winner.
//Default: 15



// ########## USEFUL NETWORKING STUFF ##########
sv_master_legacy_mode 0
sv_mincmdrate 128
sv_maxcmdrate 128
sv_minupdaterate 128
sv_maxupdaterate 128
sv_client_interpolate 0
sv_client_min_interp_ratio 0
sv_client_max_interp_ratio 0
bot_mimic 2